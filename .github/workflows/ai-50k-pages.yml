name: Deploy AI 50K to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ai-50k/**'
      - '.github/workflows/ai-50k-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload AI 50K artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ai-50k'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
